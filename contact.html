<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - TNPC</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.header {
    background: #002147;
    color: white;
    padding: 20px;
    text-align: center;
}

.section {
    max-width: 1100px;
    margin: 40px auto;
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
}

.contact-info {
    flex: 1;
}

.contact-info h2 {
    color: #002147;
}

.contact-info p {
    font-size: 16px;
    line-height: 1.6;
}

.contact-form {
    flex: 1;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.contact-form button {
    background: #002147;
    color: white;
    padding: 10px;
    border: none;
    width: 100%;
    cursor: pointer;
    border-radius: 5px;
}

.contact-form button:hover {
    background: #004080;
}

.map {
    margin-top: 40px;
    text-align: center;
}

.footer {
    background: #002147;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Contact Us</h1>
</div>

<div class="section">

    <div class="contact-info">
        <h2>Get in Touch</h2>
        <p><strong>Address:</strong><br>
        Pooja Building, Near Sardar Patel Stadium,<br>
        New District Court Road, Mehsana - 384001</p>

        <p><strong>Email:</strong><br>
        info@thenewprogressivecollege.ac.in</p>

        <p><strong>Phone:</strong><br>
        +91 93775 77596</p>
    </div>

    <div class="contact-form">
        <h2>Send Message</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <input type="text" placeholder="Subject" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

</div>

<div class="map">
    <h2>Our Location</h2>
    <iframe 
        src="https://www.google.com/maps?q=Mehsana&output=embed"
        width="90%" 
        height="300" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy">
    </iframe>
</div>

<div class="footer">
    © 2026 TNPC. All Rights Reserved.
</div>

</body>
</html>
