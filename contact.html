<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - College</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        .header {
            background-color: #002147;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: #002147;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background-color: #002147;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #004080;
        }

        .footer {
            text-align: center;
            background-color: #002147;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Contact Us</h1>
</div>

<div class="container">

    <h2>College Address</h2>
    <p>
        ABC College of Computer Science<br>
        Near City Bus Stand,<br>
        Your City - 123456<br>
        Phone: +91 9876543210<br>
        Email: info@abccollege.com
    </p>

    <h2>Send Us a Message</h2>

    <form>
        <label>Your Name</label>
        <input type="text" required>

        <label>Your Email</label>
        <input type="email" required>

        <label>Your Message</label>
        <textarea rows="5" required></textarea>

        <button type="submit">Submit</button>
    </form>

</div>

<div class="footer">
    © 2026 ABC College | All Rights Reserved
</div>

</body>
</html>
