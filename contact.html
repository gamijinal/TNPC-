<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - College</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f8f9fa;
        }
        .header {
            background: #002147;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .section {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .map {
            text-align: center;
            margin-bottom: 30px;
        }
        .map iframe {
            width: 100%;
            height: 350px;
            border: 0;
        }
        .contact-info {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .contact-info h2 {
            color: #002147;
        }
        .contact-info p {
            font-size: 16px;
            line-height: 1.6;
        }
        .contact-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .contact-form button {
            width: 100%;
            padding: 12px;
            background: #002147;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .contact-form button:hover {
            background: #004080;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Contact Us</h1>
</div>

<div class="section">

    <!-- Map Section -->         

<div class="map">
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3655.9446285889003!2d72.39258927478757!3d23.6063186942936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395c423000000007%3A0xd0e26b0c2022758d!2sThe%20New%20Progressive%20College%20Of%20Computer%20%26%20Management%20Studies%20(TNPC)!5e0!3m2!1sen!2sin!4v1770977515616!5m2!1sen!2sin",
        width="100%" 
        height="350" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy">
    </iframe>
</div>



    </div>

    <!-- College Address -->
    <div class="contact-info">
        <h2>Our Address</h2>
        <p>THE NEW PROGRESSIVE COLLEGE OF COMPUTER AND MANAGEMENT STUDIES<br>
           POOJA BUILDING,STADIUM NEAR<br>
           Mehsana - 384001, Gujarat, India</p>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
        <h2>Get In Touch</h2>
        <form>
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

</div>

</body>
</html>
